[project]
name = "scrutech-alphaearth"
version = "0.1.0"
description = "ScruTech AlphaEarth: Google satellite embeddings — GEE fetch, GeoParquet cache, RF classify, cosine change."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scrutech-core",
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "pyarrow>=16.0",
    "shapely>=2.0",
    "scikit-learn>=1.4",
    "earthengine-api>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaearth"]

[tool.uv.sources]
scrutech-core = { path = "../core", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
packages = ["alphaearth"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

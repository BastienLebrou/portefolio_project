[project]
name = "scrutech-biodiag"
version = "0.1.0"
description = "Desk-based biodiversity pre-diagnostic of a project footprint (GBIF occurrences + INPN protected areas)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scrutech-core",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "requests>=2.32",
    "matplotlib>=3.8",
    "fpdf2>=2.8",
    "rasterio>=1.3",
    "folium>=0.17",
]

[project.scripts]
biodiag = "biodiag.biodiag_aoi:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biodiag"]

[tool.uv.sources]
scrutech-core = { path = "../core", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# French report prose lives in long string literals; wrapping them would hurt readability.
"src/biodiag/report.py" = ["E501", "N806"]
"src/biodiag/cartes.py" = ["E501"]  # long matplotlib calls
"src/biodiag/proximite.py" = ["E501"]
"src/biodiag/justification.py" = ["E501"]  # French prose
"src/biodiag/schemas.py" = ["E501"]
"src/biodiag/tableaux.py" = ["E501"]
"src/biodiag/taxa.py" = ["E501"]  # species lists
"src/biodiag/biodiag_aoi.py" = ["E501"]
"src/biodiag/enjeux.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["biodiag"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
